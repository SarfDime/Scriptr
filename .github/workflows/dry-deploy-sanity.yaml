name: Dry-run Sanity validation

on:
  push:
    branches:
      - "*-s-*"
      - "*-f-*"

jobs:
  validate:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint project and check Sanity types
        run: npm run lint && npm run check-types:sanity

      - name: Build Sanity Studio
        run: npm run build:sanity

      - name: Validate GraphQL schema without deploying
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          SANITY_STUDIO_INTERNAL_SECRET: ${{ secrets.SANITY_STUDIO_INTERNAL_SECRET }}
        run: npm -w sanity run deploy-graphql -- --dataset production --dry-run
