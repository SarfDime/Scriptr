name: Dry-run Sanity validation

on:
  push:
    branches:
      - staging
      - "*-s-*"

jobs:
  validate:
    if: github.ref != 'refs/heads/staging' || contains(github.event.head_commit.message, '-s-')
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 24.x ]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
          run_install: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile --filter scriptr... --filter scriptr-sanity...

      - name: Lint project and check Sanity types
        run: corepack pnpm lint && corepack pnpm check-types:sanity

      - name: Build Sanity Studio
        run: corepack pnpm build:sanity

      - name: Validate GraphQL schema without deploying
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: corepack pnpm --filter scriptr-sanity run deploy-graphql:dry
