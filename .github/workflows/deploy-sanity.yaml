name: Deploy Sanity Studio and schema

on:
  push:
    branches:
      - main-sanity

jobs:
  deploy:
    if: contains(github.event.head_commit.message, '-s-')
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
          run_install: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile --filter scriptr... --filter scriptr-sanity...

      - name: Lint project and check Sanity types
        run: corepack pnpm lint && corepack pnpm check-types:sanity

      - name: Deploy Sanity Studio
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          SANITY_STUDIO_API_URL: ${{ secrets.SANITY_STUDIO_API_URL }}
        run: corepack pnpm --filter scriptr-sanity run deploy

      - name: Deploy GraphQL schema
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: corepack pnpm --filter scriptr-sanity run deploy-graphql:default
