name: Manual Sanity deploy with forced GraphQL update

on:
  workflow_dispatch:

jobs:
  deploy:
    if: github.ref == 'refs/heads/main-sanity'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 24.x ]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
          run_install: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile --filter scriptr... --filter scriptr-sanity...

      - name: Lint project and check Sanity types
        run: corepack pnpm lint && corepack pnpm check-types:sanity

      - name: Deploy Sanity Studio
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          SANITY_STUDIO_API_URL: ${{ secrets.SANITY_STUDIO_API_URL }}
          SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_STUDIO_PROJECT_ID }}
          SANITY_STUDIO_DATASET: ${{ vars.SANITY_STUDIO_DATASET }}
          SANITY_STUDIO_APP_ID: ${{ vars.SANITY_STUDIO_APP_ID }}
        run: corepack pnpm --filter scriptr-sanity run deploy

      - name: Force deploy GraphQL schema (breaking changes allowed)
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_STUDIO_PROJECT_ID }}
          SANITY_STUDIO_DATASET: ${{ vars.SANITY_STUDIO_DATASET }}
        run: corepack pnpm --filter scriptr-sanity run deploy-graphql:force
